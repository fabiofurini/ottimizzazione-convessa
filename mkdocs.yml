# Modello di mkdocs.yml (italiano): lo usa genera_sito.py, che scrive mkdocs.yml.
# Non modificare mkdocs.yml a mano.
site_name: Ottimizzazione convessa · Fabio Furini
site_description: >-
  Ottimizzazione convessa: le dispense del corso online, con definizioni,
  teoremi e dimostrazioni, esempi svolti ed esercizi con le soluzioni.
site_author: Fabio Furini
site_url: https://fabiofurini.github.io/ottimizzazione-convessa/
repo_url: https://github.com/fabiofurini/ottimizzazione-convessa
copyright: >-
  &copy; 2026 Fabio Furini — testi e figure con licenza
  <a href="https://creativecommons.org/licenses/by/4.0/deed.it">CC BY 4.0</a>,
  codice con licenza
  <a href="https://github.com/fabiofurini/ottimizzazione-convessa/blob/main/LICENSE-CODE">MIT</a>

theme:
  name: material
  language: it
  icon:
    logo: material/vector-curve
  font:
    text: Source Sans 3
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/weather-night
        name: Tema scuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Tema chiaro
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search:
      lang: it

extra:
  social:
    - icon: material/web
      link: https://fabiofurini.github.io/
      name: Fabio Furini — sito personale
    - icon: material/school
      link: https://www.diag.uniroma1.it/
      name: DIAG — Sapienza Università di Roma
    - icon: fontawesome/brands/github
      link: https://github.com/fabiofurini
      name: GitHub
    - icon: material/chart-timeline-variant
      link: https://fabiofurini.github.io/laboratorio-ricerca-operativa/
      name: Laboratorio di Ricerca Operativa
    - icon: material/vector-polygon
      link: https://fabiofurini.github.io/modellazione-mip/
      name: Modellazione MIP
    - icon: material/math-integral
      link: https://fabiofurini.github.io/analisi-matematica-1/
      name: Analisi Matematica 1
    - icon: material/matrix
      link: https://fabiofurini.github.io/algebra-lineare/
      name: Algebra lineare
    - icon: material/code-braces
      link: https://fabiofurini.github.io/algoritmi/
      name: Algoritmi
  alternate:
    - name: Italiano
      link: https://fabiofurini.github.io/ottimizzazione-convessa/
      lang: it
    - name: English
      link: https://fabiofurini.github.io/convex-optimization/
      lang: en

extra_css:
  - stylesheets/extra.css?v=d60085bd58
  - https://cdn.jsdelivr.net/npm/jsxgraph@1.10.1/distrib/jsxgraph.css
  - stylesheets/interattivi.css?v=e225dd77f7

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      title: In questa pagina
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/cloudflare-analytics.js?v=bff73345a1
  - javascripts/mathjax.js?v=bf833266bf
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js
  # grafici interattivi: JSXGraph, il motore, poi le ricette (gi-*.js, le aggiunge genera_sito.py)
  - https://cdn.jsdelivr.net/npm/jsxgraph@1.10.1/distrib/jsxgraphcore.js
  - javascripts/interattivi.js?v=49467b45b5
  - javascripts/gi-cap1.js?v=27c38e033c
  - javascripts/gi-cap2-4.js?v=64088905fd
  - javascripts/gi-cap5-6.js?v=3713a1d99f

nav:
  - Home: index.md
  - Preliminari:
      - preliminari/index.md
      - "1. Insiemi convessi": preliminari/01-insiemi-convessi.md
      - "2. Funzioni di più variabili": preliminari/02-funzioni-piu-variabili.md
      - "3. Funzioni convesse e concave": preliminari/03-funzioni-convesse-concave.md
      - "4. Funzioni quadratiche": preliminari/04-funzioni-quadratiche.md
  - Problemi di ottimizzazione:
      - problemi/index.md
      - "5. Problemi di ottimizzazione": problemi/05-problemi-ottimizzazione.md
      - "6. Problemi di ottimizzazione convessi e concavi": problemi/06-problemi-convessi-concavi.md
  - Esercizi:
      - esercizi/index.md
      - "1. Insiemi convessi": esercizi/es-01-insiemi-convessi.md
      - "2. Funzioni di più variabili": esercizi/es-02-funzioni-piu-variabili.md
      - "3. Funzioni convesse e concave": esercizi/es-03-funzioni-convesse-concave.md
      - "4. Funzioni quadratiche": esercizi/es-04-funzioni-quadratiche.md
      - "5. Problemi di ottimizzazione": esercizi/es-05-problemi-ottimizzazione.md
      - "6. Problemi di ottimizzazione convessi e concavi": esercizi/es-06-problemi-convessi-concavi.md
  - Laboratorio interattivo:
      - interattivi/index.md
  - Materiale: materiale.md
  - Indice completo: indice.md
